<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sonde</title>
<style>
  :root {
    --paper: #f6f7fa;
    --surface: #ffffff;
    --surface-2: #eff2f7;
    --ink: #131821;
    --ink-soft: #4c5567;
    --ink-faint: #7b8496;
    --rule: #dce1ea;
    --accent: #2b45cc;
    --accent-bg: #e9edfc;
    --ok: #16744a;
    --ok-bg: #e2f2ea;
    --warn: #8a5a00;
    --warn-bg: #f8eeda;
    --stop: #a82b23;
    --stop-bg: #f9e6e4;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1218;
      --surface: #151a22;
      --surface-2: #1b222c;
      --ink: #e5e9f0;
      --ink-soft: #9aa4b5;
      --ink-faint: #6e7889;
      --rule: #262f3c;
      --accent: #8da2ff;
      --accent-bg: #1a2240;
      --ok: #56c68f;
      --ok-bg: #102a20;
      --warn: #dfa648;
      --warn-bg: #2c2211;
      --stop: #f0857a;
      --stop-bg: #2e1614;
    }
  }

  * { box-sizing: border-box; }

  body {
    width: 420px;
    max-height: 580px;
    overflow-y: auto;
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: system-ui, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }

  header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--rule);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 2;
  }

  h1 {
    font-size: 13px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }

  .avertissement {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ok);
  }

  .domaine {
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--surface-2);
  }

  .domaine .url {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    word-break: break-all;
    display: block;
    margin-bottom: 8px;
  }

  button {
    font: inherit;
    font-size: 12px;
    padding: 6px 12px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  button.principal {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.principal:hover { color: #fff; opacity: 0.9; }

  button.arret {
    background: var(--stop-bg);
    border-color: var(--stop);
    color: var(--stop);
  }

  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  main { padding: 12px 16px 20px; }

  .vide {
    color: var(--ink-faint);
    font-size: 12px;
    padding: 20px 0;
    text-align: center;
  }

  .site {
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--surface);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .site > h2 {
    font-size: 12px;
    margin: 0;
    padding: 9px 12px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: baseline;
  }
  .site > h2 .hote { font-family: var(--mono); font-size: 11px; font-weight: 600; }

  .reponses { padding: 4px 12px 10px; }

  .q {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid var(--surface-2);
    align-items: baseline;
  }
  .q:last-child { border-bottom: 0; }
  .q .code { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
  .q .lib { color: var(--ink-soft); font-size: 12px; }
  .q .val { font-family: var(--mono); font-size: 11px; text-align: right; }

  .etiquette {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 1px 7px;
    border-radius: 2px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .etiquette.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
  .etiquette.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
  .etiquette.stop { background: var(--stop-bg); color: var(--stop); border-color: var(--stop); }
  .etiquette.idle { background: var(--surface-2); color: var(--ink-faint); border-color: var(--rule); }

  footer {
    padding: 12px 16px;
    border-top: 1px solid var(--rule);
    background: var(--surface);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    position: sticky;
    bottom: 0;
  }
</style>
</head>
<body>

<header>
  <h1>Sonde — reconnaissance de formulaires</h1>
  <span class="avertissement">Lecture seule · n'écrit rien, ne clique nulle part</span>

  <div class="domaine">
    <span class="url" id="url">…</span>
    <div class="actions">
      <button id="basculer" class="principal">Observer ce site</button>
      <button id="cadre">Détecter le cadre applicatif</button>
    </div>
  </div>
</header>

<main id="resultats">
  <p class="vide">Chargement…</p>
</main>

<footer>
  <button id="exporter" class="principal">Exporter le rapport</button>
  <button id="vider" class="arret">Tout effacer</button>
</footer>

<script src="commun.js"></script>
<script src="panneau.js"></script>
</body>
</html>
