<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tarificateur Auto — étape 1</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  fieldset { border: 1px solid #ccc; margin-bottom: 16px; padding: 12px 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  .champ { margin-bottom: 10px; }
  label { display: block; margin-bottom: 2px; font-size: 14px; }
  input, select { padding: 5px; font: inherit; }
  .txt { font-size: 14px; margin-bottom: 2px; }
  .aide { font-size: 13px; color: #555; display: flex; align-items: center; gap: 10px; }
  .aide button { font: inherit; padding: 4px 10px; cursor: pointer; }
  #bloc-leasing { display: none; }
</style>
</head>
<body>

<h1>Tarificateur Auto — étape 1</h1>

<!-- Raccourci de la PAGE DE TEST, pour ne pas resaisir à chaque passage.
     Ce bouton appartient à la page : la sonde n'écrit jamais nulle part. -->
<p class="aide">
  <button type="button" id="preremplir">Remplir pour tester</button>
  <span>bouton de la page de test — trois champs sont obligatoires</span>
</p>

<form id="devis">

  <fieldset>
    <legend>Conducteur principal</legend>

    <!-- cas 1 : label for= -->
    <div class="champ">
      <label for="nom">Nom de naissance</label>
      <input type="text" id="nom" name="conducteur_nom" required maxlength="40">
    </div>

    <!-- cas 2 : label englobant -->
    <div class="champ">
      <label>Prénom
        <input type="text" id="prenom" name="conducteur_prenom" required>
      </label>
    </div>

    <!-- cas 3 : aria-label -->
    <div class="champ">
      <input type="text" id="dtNaiss" name="date_naissance"
             aria-label="Date de naissance" placeholder="JJ/MM/AAAA"
             pattern="\d{2}/\d{2}/\d{4}" required>
    </div>

    <!-- cas 4 : aucun label, texte qui précède -->
    <div class="champ">
      <div class="txt">Date d'obtention du permis</div>
      <input type="text" id="ctl00_dtPermis" name="permis_date" placeholder="JJ/MM/AAAA">
    </div>

    <!-- select avec valeurs opaques -->
    <div class="champ">
      <label for="situation">Situation familiale</label>
      <select id="situation" name="situation_familiale">
        <option value="">-- Choisir --</option>
        <option value="1">Célibataire</option>
        <option value="2">Marié(e)</option>
        <option value="5">Pacsé(e)</option>
      </select>
    </div>

    <!-- groupe radio : 3 boutons, UN seul champ -->
    <div class="champ">
      <div class="txt">Sexe</div>
      <label><input type="radio" name="sexe" value="M"> Homme</label>
      <label><input type="radio" name="sexe" value="F"> Femme</label>
      <label><input type="radio" name="sexe" value="A"> Autre</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Véhicule</legend>

    <div class="champ">
      <label for="immat">Immatriculation</label>
      <input type="text" id="immat" name="immatriculation" maxlength="9">
    </div>

    <div class="champ">
      <label for="financement">Mode de financement</label>
      <select id="financement" name="financement">
        <option value="">-- Choisir --</option>
        <option value="C">Comptant</option>
        <option value="L">Leasing / LOA</option>
      </select>
    </div>

    <!-- champ CONDITIONNEL : inséré dans le DOM seulement si leasing -->
    <div class="champ" id="bloc-leasing"></div>
  </fieldset>

  <!-- doivent être IGNORÉS par la sonde -->
  <input type="hidden" name="__VIEWSTATE" value="ignoré">
  <div class="champ">
    <label for="mdp">Mot de passe (ne doit pas être relevé)</label>
    <input type="password" id="mdp" name="motdepasse">
  </div>

  <button type="submit">Suivant</button>
</form>

<script>
  // Champ conditionnel : inséré dans le DOM après un choix. C'est le cas Q5.
  document.getElementById("financement").addEventListener("change", (evenement) => {
    const bloc = document.getElementById("bloc-leasing");

    bloc.innerHTML = evenement.target.value === "L"
      ? '<label for="bailleur">Nom du bailleur</label>'
        + '<input type="text" id="bailleur" name="bailleur">'
      : "";
  });

  // Pré-remplissage : c'est la PAGE qui écrit dans ses propres champs,
  // pour éviter la resaisie à chaque aller-retour. La sonde n'écrit jamais.
  document.getElementById("preremplir").addEventListener("click", () => {
    const valeurs = {
      nom: "DUPONT",
      prenom: "Jean",
      dtNaiss: "07/03/1985",
      ctl00_dtPermis: "12/09/2004",
      immat: "AB-123-CD"
    };

    Object.entries(valeurs).forEach(([identifiant, valeur]) => {
      document.getElementById(identifiant).value = valeur;
    });

    document.getElementById("situation").value = "2";
    document.querySelector("input[name='sexe'][value='M']").checked = true;
  });

  // « Suivant » mène à une vraie étape 2, par rechargement complet de page.
  // C'est ce qui permet de vérifier Q1 (nombre d'étapes) et Q2 (mécanisme).
  document.getElementById("devis").addEventListener("submit", (evenement) => {
    evenement.preventDefault();
    location.href = "test-formulaire-2.html";
  });
</script>

</body>
</html>
