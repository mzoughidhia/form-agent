<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Tarificateur Auto — étape 2</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  fieldset { border: 1px solid #ccc; margin-bottom: 16px; padding: 12px 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  .champ { margin-bottom: 10px; }
  label { display: block; margin-bottom: 2px; font-size: 14px; }
  input, select { padding: 5px; font: inherit; }
  .txt { font-size: 14px; margin-bottom: 2px; }
  nav { font-size: 13px; margin-bottom: 16px; color: #555; }
</style>
</head>
<body>

<nav>Étape 1 — Conducteur &nbsp;›&nbsp; <strong>Étape 2 — Antécédents</strong></nav>
<h1>Tarificateur Auto — étape 2</h1>

<form id="antecedents">

  <fieldset>
    <legend>Antécédents d'assurance</legend>

    <div class="champ">
      <label for="assureur">Assureur précédent</label>
      <input type="text" id="assureur" name="assureur_precedent" maxlength="60">
    </div>

    <div class="champ">
      <label for="bonus">Coefficient bonus-malus</label>
      <input type="text" id="bonus" name="bonus_malus" placeholder="0,50" required>
    </div>

    <div class="champ">
      <label for="anciennete">Ancienneté du contrat</label>
      <select id="anciennete" name="anciennete_contrat">
        <option value="">-- Choisir --</option>
        <option value="0">Moins d'un an</option>
        <option value="1">1 à 3 ans</option>
        <option value="3">Plus de 3 ans</option>
      </select>
    </div>

    <div class="champ">
      <div class="txt">Résiliation par l'assureur</div>
      <label><input type="radio" name="resiliation" value="O"> Oui</label>
      <label><input type="radio" name="resiliation" value="N"> Non</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Sinistres</legend>

    <div class="champ">
      <label for="nbSinistres">Nombre de sinistres sur 36 mois</label>
      <input type="number" id="nbSinistres" name="nb_sinistres" min="0" max="20">
    </div>

    <div class="champ">
      <label for="dernierSinistre">Date du dernier sinistre</label>
      <input type="text" id="dernierSinistre" name="date_dernier_sinistre" placeholder="JJ/MM/AAAA">
    </div>
  </fieldset>

  <button type="button" id="retour">Précédent</button>
  <button type="submit">Valider le devis</button>
</form>

<p id="fin" style="display:none; color:#16744a; font-weight:600;">
  Devis envoyé. La sonde n'a rien écrit, rien cliqué : elle a seulement observé.
</p>

<script>
  document.getElementById("retour").addEventListener("click", () => {
    location.href = "test-formulaire.html";
  });

  document.getElementById("antecedents").addEventListener("submit", (evenement) => {
    evenement.preventDefault();
    document.getElementById("antecedents").style.display = "none";
    document.getElementById("fin").style.display = "block";
  });
</script>

</body>
</html>
