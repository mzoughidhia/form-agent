<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Form Agent</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            font-size: 13px;
            width: 290px;
            margin: 0;
            padding: 12px;
        }

        h3 {
            margin: 0 0 4px;
        }

        .aide {
            margin: 0 0 10px;
            color: #666;
            font-size: 12px;
            line-height: 1.35;
        }

        h4 {
            margin: 16px 0 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #888;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
        }

        input, select {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 5px 6px;
            margin-top: 2px;
            border: 1px solid #bbb;
            border-radius: 3px;
            font-size: 13px;
            background: #fff;
        }

        label.case {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 12px 0 0;
        }

        label.case input {
            display: inline;
            width: auto;
            margin: 0;
        }

        button {
            padding: 7px;
            border: 1px solid #bbb;
            border-radius: 3px;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover {
            background: #e9e9e9;
        }

        #fill {
            width: 100%;
            background: #1a73e8;
            border-color: #1a73e8;
            color: #fff;
            font-weight: 600;
            padding: 9px;
        }

        #fill:hover {
            background: #1666ce;
        }

        #etat {
            margin-top: 10px;
            padding: 8px;
            border-radius: 3px;
            background: #f1f3f4;
            font-size: 12px;
            line-height: 1.4;
            color: #333;
        }

        #etat.connu {
            background: #e6f4ea;
        }

        #etat b {
            display: block;
        }

        .lien {
            margin-top: 6px;
            padding: 0;
            border: 0;
            background: none;
            color: #c62828;
            cursor: pointer;
            font-size: 12px;
            text-decoration: underline;
        }

        .lien:hover {
            background: none;
        }

        #message {
            margin: 10px 0 0;
            min-height: 16px;
            color: #2e7d32;
        }

        #message.erreur {
            color: #c62828;
        }

        details {
            margin-top: 8px;
            border-top: 1px solid #e0e0e0;
            padding-top: 8px;
        }

        summary {
            cursor: pointer;
            color: #444;
        }

        ul.memoire {
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
        }

        ul.memoire li {
            display: flex;
            justify-content: space-between;
            gap: 6px;
            padding: 3px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        ul.memoire .cle {
            color: #666;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        ul.memoire .valeur {
            color: #111;
            max-width: 45%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #save {
            width: 100%;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <h3>Form Agent</h3>

    <p class="aide">
        Remplis le formulaire une fois : la structure et les valeurs sont
        enregistrées automatiquement, sans rien cliquer. Ensuite, ce bouton
        suffit.
    </p>

    <button id="fill">Remplir ce formulaire</button>

    <div id="etat">Lecture de la page…</div>

    <p id="message"></p>

    <details>
        <summary><span id="compteurStructure">Structure enregistrée</span></summary>
        <ul class="memoire" id="listeStructure"></ul>
    </details>

    <h4>Données connues</h4>

    <!-- Champ libre et non liste fermée : l'observation peut ramener
         "Monsieur", "M." ou "Mr" selon le formulaire d'origine. -->
    <label>Civilité<input id="civilite" placeholder="M. / Mme / Monsieur"></label>

    <label>Nom<input id="nom"></label>
    <label>Prénom<input id="prenom"></label>
    <label>Email<input id="email" type="email"></label>
    <label>Téléphone<input id="telephone"></label>
    <label>Adresse<input id="adresse"></label>
    <label>Code postal<input id="codePostal"></label>
    <label>Ville<input id="ville"></label>
    <label>Pays<input id="pays"></label>
    <label>Date de naissance<input id="dateNaissance" placeholder="JJ/MM/AAAA"></label>

    <label class="case">
        <input type="checkbox" id="newsletter">
        Accepter les newsletters
    </label>

    <button id="save">Enregistrer ces corrections</button>

    <details>
        <summary><span id="compteurAppris">0 champ appris</span></summary>
        <ul class="memoire" id="listeAppris"></ul>
        <button id="oublierAppris" class="lien">Vider la mémoire apprise</button>
    </details>

    <script src="popup.js"></script>
</body>
</html>
